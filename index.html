<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Holder</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 20px; 
      background-color: #d3d3d3; 
      color: #333;
      transition: background-color 0.3s, color 0.3s;
    }
    h1 { text-align: center; }
    .tela { display: none; margin-top: 20px; }
    .ativo { display: block; }
    button { 
      margin: 5px; 
      padding: 8px 15px; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold;
      transition: background-color 0.3s;
    }
    #principal button { background-color: #007bff; color: white; }
    #cadastro button[type="submit"] { background-color: #28a745; color: white; }
    #cadastro button, #pesquisa button { background-color: #6c757d; color: white; }
    .btn-saida { background-color: #dc3545; color: white; }
    .btn-entrada { background-color: #28a745; color: white; }
    .btn-excluir { background-color: #ff5733; color: white; }
    .btn-limpar { background-color: #ffc107; color: black; }
    .btn-darkmode { background-color: #343a40; color: white; }

    table { 
      border-collapse: collapse; 
      width: 100%; 
      margin-top: 10px; 
      background: #fff; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: background-color 0.3s, color 0.3s;
    }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f8f9fa; }
    input { 
      text-transform: uppercase; 
      width: 100%; 
      padding: 6px; 
      border: 1px solid #aaa; 
      border-radius: 4px;
    }
    .form-campos {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 400px;
      margin: auto;
    }
    .form-campos label { font-weight: bold; }

    body.dark { background-color: #121212; color: #e0e0e0; }
    body.dark table { background-color: #1e1e1e; color: #e0e0e0; }
    body.dark th { background-color: #333; }

    /* Notificações */
    #notificacoes { position:fixed; top:20px; right:20px; z-index:9999; }
    .notificacao {
      margin-bottom: 10px;
      padding: 10px 15px;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      opacity: 0.95;
    }
    .sucesso { background-color: #28a745; }
    .erro { background-color: #dc3545; }
    .aviso { background-color: #ffc107; color: #000; }
    .info { background-color: #007bff; }
  </style>
</head>
<body>
  <h1>Controle de Holder</h1>
  
  <!-- Botão Dark Mode -->
  <div style="text-align:center;">
    <button class="btn-darkmode" onclick="toggleDarkMode()">🌙 Alternar Dark Mode</button>
  </div>
  
  <!-- Tela principal -->
  <div id="principal" class="ativo" style="text-align:center;">
    <button onclick="abrirTela('cadastro')">➕ Cadastro</button>
    <button onclick="abrirTela('pesquisa')">🔍 Pesquisa</button>
  </div>
  
  <!-- Tela de Cadastro -->
  <div id="cadastro" class="tela">
    <h2>Cadastro de Holder</h2>
    <form id="formCadastro" class="form-campos">
      <label>HLD:
        <input type="text" id="nome" required>
      </label>
      <label>Quantidade:
        <input type="number" id="quantidade" required>
      </label>
      <label>Caixa:
        <input type="number" id="setor" required>
      </label>
      <button type="submit">💾 Salvar</button>
    </form>
    <button onclick="abrirTela('principal')">⬅️ Voltar</button>
  </div>
  
  <!-- Tela de Pesquisa -->
  <div id="pesquisa" class="tela">
    <h2>Pesquisa por Holder</h2>
    <input type="text" id="busca" placeholder="Digite o nome do Holder">
    <button onclick="pesquisar()">🔍 Pesquisar</button>
    <button class="btn-limpar" onclick="limparPesquisa()">🧹 Limpar pesquisa</button>
    <table id="tabela">
      <thead>
        <tr><th>HLD</th><th>Quantidade</th><th>CAIXA</th><th>Ações</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="mensagem"></div>
    <button onclick="abrirTela('principal')">⬅️ Voltar</button>
  </div>

  <!-- Container de notificações -->
  <div id="notificacoes"></div>
  
  <script>
    let estoque = JSON.parse(localStorage.getItem("estoque")) || [];

    function salvarEstoque() {
      localStorage.setItem("estoque", JSON.stringify(estoque));
    }

    function abrirTela(tela) {
      document.querySelectorAll('.tela, #principal').forEach(div => div.classList.remove('ativo'));
      document.getElementById(tela).classList.add('ativo');
      if (tela === 'principal') {
        limparPesquisa();
      }
    }

    function mostrarNotificacao(mensagem, tipo="info") {
      const container = document.getElementById("notificacoes");
      const notif = document.createElement("div");
      notif.textContent = mensagem;
      notif.classList.add("notificacao");
      notif.classList.add(tipo);
      container.appendChild(notif);
      setTimeout(() => notif.remove(), 3000);
    }

    // Cadastro com verificação de duplicados
    document.getElementById('formCadastro').addEventListener('submit', function(e) {
      e.preventDefault();
      let nome = document.getElementById('nome').value.toUpperCase();
      let quantidade = parseInt(document.getElementById('quantidade').value);
      let setor = parseInt(document.getElementById('setor').value);

      let existe = estoque.some(item => item.nome === nome);
      if (existe) {
        mostrarNotificacao("Produto já existe no estoque!", "aviso");
      } else {
        estoque.push({ nome, quantidade, setor });
        salvarEstoque();
        mostrarNotificacao("Produto cadastrado com sucesso!", "sucesso");
        this.reset();
      }
    });

    function pesquisar() {
      let termo = document.getElementById('busca').value.toLowerCase();
      let resultados = estoque.map((item, idx) => ({...item, idx}))
                              .filter(item => item.nome.toLowerCase().includes(termo));

      let tbody = document.querySelector('#tabela tbody');
      let mensagem = document.getElementById('mensagem');
      tbody.innerHTML = "";
      mensagem.innerHTML = "";

      if (resultados.length === 0) {
        mensagem.innerHTML = `
          <p>Produto não encontrado.</p>
          <button onclick="abrirTela('cadastro')">➕ Cadastrar novo produto</button>
        `;
      } else {
        resultados.forEach(item => {
          let linha = `
            <tr>
              <td>${item.nome}</td>
              <td>${item.quantidade}</td>
              <td>${item.setor}</td>
              <td>
                <button class="btn-saida" onclick="saidaProduto(${item.idx})">❌ Saída</button>
                <button class="btn-entrada" onclick="entradaProduto(${item.idx})">✅ Entrada</button>
                <button class="btn-excluir" onclick="excluirProduto(${item.idx})">🗑️ Excluir</button>
              </td>
            </tr>`;
          tbody.innerHTML += linha;
        });
      }
    }

        function limparPesquisa() {
      document.getElementById('busca').value = "";
      document.querySelector('#tabela tbody').innerHTML = "";
      document.getElementById('mensagem').innerHTML = "";
    }

    function saidaProduto(index) {
      let qtdSaida = prompt("Digite a quantidade de saída para " + estoque[index].nome);
      if (qtdSaida !== null && !isNaN(qtdSaida)) {
        qtdSaida = parseInt(qtdSaida);
        if (qtdSaida > 0 && qtdSaida <= estoque[index].quantidade) {
          estoque[index].quantidade -= qtdSaida;
          salvarEstoque();
          mostrarNotificacao("Saída registrada com sucesso!", "sucesso");
          pesquisar();
        } else {
          mostrarNotificacao("Quantidade inválida. A saída não pode ser maior que o estoque atual.", "erro");
        }
      }
    }

    function entradaProduto(index) {
      let qtdEntrada = prompt("Digite a quantidade de entrada para " + estoque[index].nome);
      if (qtdEntrada !== null && !isNaN(qtdEntrada)) {
        qtdEntrada = parseInt(qtdEntrada);
        if (qtdEntrada > 0) {
          estoque[index].quantidade += qtdEntrada;
          salvarEstoque();
          mostrarNotificacao("Entrada registrada com sucesso!", "sucesso");
          pesquisar();
        } else {
          mostrarNotificacao("Quantidade inválida. A entrada deve ser maior que zero.", "erro");
        }
      }
    }

    function excluirProduto(index) {
      if (confirm("Tem certeza que deseja excluir o produto " + estoque[index].nome + "?")) {
        estoque.splice(index, 1); // remove o item do array
        salvarEstoque();
        mostrarNotificacao("Produto excluído com sucesso!", "sucesso");
        pesquisar(); // atualiza a tabela
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }
  </script>
</body>
</html>
