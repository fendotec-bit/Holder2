<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro e Pesquisa</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }
    .container {
      width: 95%;
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .tela { display: none; }
    .ativa { display: block; }
    h2 { text-align: center; font-size: 1.4em; }
    button {
      margin: 8px 0;
      padding: 12px;
      font-size: 1em;
      text-transform: uppercase;
      width: 100%;
    }
    input {
      margin: 8px 0;
      padding: 10px;
      width: 100%;
      font-size: 1em;
      box-sizing: border-box;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 0.9em;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }
    th { background-color: #eee; }
    @media (max-width: 480px) {
      h2 { font-size: 1.2em; }
      button, input { font-size: 0.9em; }
      table { font-size: 0.8em; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Tela inicial -->
    <div id="telaInicial" class="tela ativa">
      <h2>BEM-VINDO</h2>
      <button onclick="mostrarTela('telaCadastro')">CADASTRO</button>
      <button onclick="mostrarTela('telaPesquisa')">PESQUISAR</button>
      <button onclick="mostrarTela('telaExcluirCaixa')">EXCLUIR / EDITAR</button>
    </div>

    <!-- Tela de cadastro -->
    <div id="telaCadastro" class="tela">
      <h2>CADASTRO</h2>
      <form id="formCadastro">
        <label><h2>HLD</h2)>:<br><input type="number" name="item" required></label><br>
        <label>QUANTIDADE:<br><input type="number" name="quantidade" required></label><br>
        <label><h2>CAIXA:</h2><br><input type="number" name="caixa" required></label><br>
        <button type="submit">SALVAR</button>
      </form>
      <button onclick="mostrarTela('telaInicial')">VOLTAR</button>
    </div>

    <!-- Tela de pesquisa -->
    <div id="telaPesquisa" class="tela">
      <h2>PESQUISAR</h2>
      <form id="formPesquisa">
        <label><h2>HLD</h2><br><input type="number" name="busca"></label><br>
        <button type="submit">BUSCAR</button>
      </form>
      <button onclick="mostrarTela('telaInicial')">VOLTAR</button>
    </div>

    <!-- Tela de exclusão/edição -->
    <div id="telaExcluirCaixa" class="tela">
      <h2>EXCLUIR OU EDITAR POR CAIXA</h2>
      <form id="formCaixa">
        <label>DIGITE O NÚMERO DA CAIXA:<br><input type="number" name="caixaBusca" required></label><br>
        <button type="submit">MOSTRAR ITENS</button>
      </form>
      <button onclick="mostrarTela('telaInicial')">VOLTAR</button>

      <h3>ITENS DA CAIXA</h3>
      <table id="tabelaExcluir">
        <thead>
          <tr>
            <th>ITEM</th>
            <th>QUANTIDADE</th>
            <th>CAIXA</th>
            <th>AÇÕES</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    let registros = JSON.parse(localStorage.getItem('registros')) || [];

    function mostrarTela(id) {
      document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
      document.getElementById(id).classList.add('ativa');
    }

    // Cadastro com ID único e campos numéricos
    document.getElementById('formCadastro').addEventListener('submit', function(e) {
      e.preventDefault();
      const dados = new FormData(this);
      const item = parseInt(dados.get('item'), 10);
      const quantidade = parseInt(dados.get('quantidade'), 10);
      const caixa = parseInt(dados.get('caixa'), 10);
      const id = Date.now(); // ID único

      registros.push({ id, item, quantidade, caixa });
      localStorage.setItem('registros', JSON.stringify(registros));

      alert(`CADASTRO SALVO:\nITEM: ${item}\nQUANTIDADE: ${quantidade}\nCAIXA: ${caixa}`);
      this.reset();
      mostrarTela('telaInicial');
    });

    // Pesquisa por número do item
    document.getElementById('formPesquisa').addEventListener('submit', function(e) {
      e.preventDefault();
      const busca = parseInt(new FormData(this).get('busca'), 10);
      const resultado = registros.filter(r => r.item === busca);
      if (resultado.length > 0) {
        alert("RESULTADOS ENCONTRADOS:\n" + resultado.map(r => `${r.item} - ${r.quantidade} (CAIXA: ${r.caixa})`).join("\n"));
      } else {
        alert("NENHUM ITEM ENCONTRADO.");
      }
    });

    // Exibir itens da caixa
    document.getElementById('formCaixa').addEventListener('submit', function(e) {
      e.preventDefault();
      const caixaBusca = parseInt(new FormData(this).get('caixaBusca'), 10);
      const tbody = document.querySelector('#tabelaExcluir tbody');
      tbody.innerHTML = '';
      const resultado = registros.filter(r => r.caixa === caixaBusca);
      resultado.forEach((r, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.item}</td>
          <td>${r.quantidade}</td>
          <td>${r.caixa}</td>
          <td>
            <button onclick="excluirRegistro(${r.id})">EXCLUIR</button>
            <button onclick="editarRegistro(${r.id}, ${index}, ${caixaBusca})">EDITAR</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
      if (resultado.length === 0) {
        alert("NENHUM ITEM ENCONTRADO NA CAIXA " + caixaBusca);
      }
    });

    // Excluir pelo ID
    function excluirRegistro(id) {
      const itemRemovido = registros.find(r => r.id === id);
      registros = registros.filter(r => r.id !== id);
      localStorage.setItem('registros', JSON.stringify(registros));
      alert(`ITEM EXCLUÍDO: ${itemRemovido.item} (CAIXA ${itemRemovido.caixa})`);
      document.getElementById('formCaixa').dispatchEvent(new Event('submit'));
    }

    // Editar todos os campos inline
    function editarRegistro(id, indexNaLista, caixaBusca) {
      const itensCaixa = registros.filter(r => r.caixa === caixaBusca);
      const itemSelecionado = itensCaixa.find(r => r.id === id);

      const tr = document.querySelector(`#tabelaExcluir tbody`).children[indexNaLista];
      tr.innerHTML = `
        <td><input type="number" id="novoItem-${id}" value="${itemSelecionado.item}"></td>
        <td><input type="number" id="novoQtd-${id}" value="${itemSelecionado.quantidade}" style="width:60px;"></td>
        <td><input type="number" id="novoCaixa-${id}" value="${itemSelecionado.caixa}"></td>
        <td>
          <button onclick="salvarRegistro(${id}, ${caixaBusca})">SALVAR</button>
          <button onclick="document.getElementById('formCaixa').dispatchEvent(new Event('submit'))">CANCELAR</button>
        </td>
      `;
    }

        // Salvar alterações pelo ID
    function salvarRegistro(id, caixaBusca) {
      const novoItem = parseInt(document.getElementById(`novoItem-${id}`).value, 10);
      const novaQtd = parseInt(document.getElementById(`novoQtd-${id}`).value, 10);
      const novoCaixa = parseInt(document.getElementById(`novoCaixa-${id}`).value, 10);

      registros = registros.map(r => {
        if (r.id === id) {
          return { ...r, item: novoItem, quantidade: novaQtd, caixa: novoCaixa };
        }
        return r;
      });

      localStorage.setItem('registros', JSON.stringify(registros));
      alert(`ITEM ALTERADO:\n${novoItem} - ${novaQtd} (CAIXA: ${novoCaixa})`);
      document.getElementById('formCaixa').dispatchEvent(new Event('submit'));
    }
  </script>

</body>
</html>
